[defaults]
inventory = inventory/
# collections_path = ./collections
roles_path = ./roles

forks = 20

fact_caching = jsonfile
fact_caching_connection = .ansible_cache
fact_caching_timeout = 86400

host_key_checking = True
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ForwardAgent=no

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
workflow:
  name: build_deploy_application
  rules:
    - when: never
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev"'
      when: always
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
      when: always
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      when: always

default:
  interruptible: true
  image: docker:latest

services:
  - docker:dind

stages:
  - test
  - build
  - deploy

run_lint:
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      changes: 
        - src/**
      when: always
  retry: 2
  stage: test
  before_script:
    - node --version && npm --version
    - npm i -g pnpm && pnpm lint
    - pnpm biome:ci 'pnpm biome ci --reporter=gitlab --colors=off > /tmp/code-quality.json || true'
    - cp /tmp/code-quality.json code-quality.json'
  script:
    - echo "run testing task"
    - pnpm test
  after_script: echo "done."
  artifacts:
    name: artifacts
    reports:
      junit: /path/to/test.xml
      sast: /path/to/sast.xml
      codequality: /path/to/code-quality.json
    paths:
      - /project/to/test.xml
      - /project/to/sast.xml
      - /project/to/code-quality.json
    access: all
    expire_in: '30 days'

run_build:
  stage: build
  services:
    - name: docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
  before_script:
    - docker version
    - docker login registry.gitlab.com -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
  script:
    - docker buildx bake -f docker-bake.hcl default --push --set *.secrets="id=gh_token,env=GH_TOKEN"
  after_script:
    - echo "built && pushed"


run_deploy:
  image: ubuntu:devel
  stage: deploy
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never
  variables:
    SERVICE_NAME: server-web
  before_script:
    - apt-get update -y && apt-get install -y openssh-client
    - mkdir ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add - > /dev/null
    - ssh-keyscan $HOST_IP > ~/.ssh/known_hosts
  script:
    - ssh $USERNAME@$HOST_IP "
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.gitlab.com &&
      docker-compose -f $COMPOSE_FILE down \"$SERVICE_NAME\" &&
      docker-compose -f $COMPOSE_FILE up -d
      "
  after_script:
    - echo "Application restarted."


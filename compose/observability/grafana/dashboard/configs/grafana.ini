[server]
protocol = http
http_port = 3000
domain = grafana.localhost
root_url = https://grafana.localhost
serve_from_sub_path = true

[database]
type = postgres
host = grafana-db:5432
name = grafana
user = $GF_DB_USER
password = $GF_DB_PASSWORD
ssl_mode = disable

[security]
admin_user = $GF_ADMIN_USER
admin_email = $GF_ADMIN_EMAIL
admin_password = $GF_ADMIN_PASSWORD

[users]
allow_sign_up = false
default_theme = light

[auth]
disable_login_form = false
oauth_auto_login = false

[auth.anonymous]
enabled = false

[clustering]
enabled = true

[session]
provider = redis
provider_config = addr=grafana-redis:6379,pool_size=100,db=0

[remote_cache]
type = redis
connstr = addr=grafana-redis:6379,pool_size=100,db=1

[smtp]
enabled = true
host = mailpit:1025
user = user
password = """password"""
skip_verify = true
from_address = admin@local.host
from_name = no-reply
enable_tracing = false

[log]
level = debug
[log.console]
format = json
name: autoheal

services:
  
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200Mib
          cpus: .2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 240
      AUTOHEAL_INTERVAL: 30
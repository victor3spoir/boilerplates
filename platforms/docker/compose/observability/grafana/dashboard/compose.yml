name: grafana

networks:
  grafana-net:
    driver: bridge
  docker-net:
    external: true

configs:
  grafana_config:
    content: |
      [server]
      protocol = http
      http_port = 3000
      domain = grafana.localhost
      root_url = https://grafana.localhost
      serve_from_sub_path = true

      [database]
      type = postgres
      host = grafana-db:5432
      name = grafana
      user = $GF_DB_USER
      password = $GF_DB_PASSWORD
      ssl_mode = disable

      [security]
      admin_user = $GF_ADMIN_USER
      admin_email = $GF_ADMIN_EMAIL
      admin_password = $GF_ADMIN_PASSWORD

      [users]
      allow_sign_up = false
      default_theme = light

      [auth]
      disable_login_form = false
      oauth_auto_login = false

      [auth.anonymous]
      enabled = false

      [clustering]
      enabled = true

      [session]
      provider = redis
      provider_config = addr=grafana-redis:6379,pool_size=100,db=0

      [remote_cache]
      type = redis
      connstr = addr=grafana-redis:6379,pool_size=100,db=1

      [smtp]
      enabled = true
      host = mailpit:1025
      user = user
      password = """password"""
      skip_verify = true
      from_address = admin@local.host
      from_name = no-reply
      enable_tracing = false
      [log]
      level = debug
      [log.console]
      format = json
  caddy_config:
    content: |
      {
          admin off
      }
      :80 {
          reverse_proxy {
              to grafana-01:3000 grafana-02:3000 grafana-03:3000
              # Health check to detect unresponsive instances
              health_path /api/health
              health_interval 5s
              health_timeout 2s
              lb_policy first
              fail_duration 10s
              max_fails 1
              transport http {
                  read_timeout 5s
                  write_timeout 10s
                  dial_timeout 5s
                  keepalive 30s
              }
          }
          encode gzip
          header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "SAMEORIGIN"
              Referrer-Policy "strict-origin-when-cross-origin"
              X-XSS-Protection "1; mode=block"
              -Server
          }
      }

volumes:
  grafana-01-vol:
    name: grafana-01-vol
    driver: local
  grafana-02-vol:
    name: grafana-02-vol
    driver: local
  grafana-03-vol:
    name: grafana-03-vol
    driver: local
  grafana-db-vol:
    name: grafana-db-vol
    driver: local
  grafana-redis-vol:
    name: grafana-redis-vol
    driver: local
  caddy-data:
  caddy-config:

services:
  grafana-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 200Mib
    volumes:
      - grafana-redis-vol:/data
    networks:
      - grafana-net

  grafana-db:
    image: postgres:17-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.3
          memory: 500Mib
    volumes:
      - grafana-db-vol:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=$GF_DB_USER
      - POSTGRES_PASSWORD=$GF_DB_PASSWORD
      - POSTGRES_DB=grafana
    networks:
      - grafana-net
  grafana-01:
    depends_on:
      - grafana-db
      - grafana-redis
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500Mib
          cpus: 0.5
    volumes:
      - grafana-01-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      - GF_SERVER_DOMAIN=grafana.localhost
      - GF_SERVER_ROOT_URL=https://grafana.localhost
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_CLUSTERING_ENABLED=true
      - GF_CLUSTERING_NAME=grafana-cluster
      - GF_CLUSTERING_ADVERTISE_ADDRESS=grafana-01:9094
      - GF_CLUSTERING_GOSSIP_INTERVAL=200ms
    networks:
      - grafana-net
      - docker-net

  grafana-02:
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500Mib
          cpus: 0.5
    volumes:
      - grafana-02-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      - GF_SERVER_DOMAIN=grafana.localhost
      - GF_SERVER_ROOT_URL=https://grafana.localhost
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_CLUSTERING_ENABLED=true
      - GF_CLUSTERING_NAME=grafana-cluster
      - GF_CLUSTERING_ADVERTISE_ADDRESS=grafana-02:9094
      - GF_CLUSTERING_JOIN=grafana-01:9094
      - GF_CLUSTERING_GOSSIP_INTERVAL=200ms
    networks:
      - grafana-net
      - docker-net
    depends_on:
      - grafana-01

  grafana-03:
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500Mib
          cpus: 0.5
    volumes:
      - grafana-03-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      - GF_SERVER_DOMAIN=grafana.localhost
      - GF_SERVER_ROOT_URL=https://grafana.localhost
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_CLUSTERING_ENABLED=true
      - GF_CLUSTERING_NAME=grafana-cluster
      - GF_CLUSTERING_ADVERTISE_ADDRESS=grafana-03:9094
      - GF_CLUSTERING_JOIN=grafana-01:9094
      - GF_CLUSTERING_GOSSIP_INTERVAL=200ms
    networks:
      - grafana-net
      - docker-net
    depends_on:
      - grafana-01
      - grafana-redis

  grafana:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 200Mib
    volumes:
      - caddy-data:/data
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    networks:
      - grafana-net
      - docker-net
    depends_on:
      - grafana-01
      - grafana-02
      - grafana-03
      - grafana-redis
    labels:
      - traefik.enable=true
      - traefik.http.services.grafana-svc.loadbalancer.server.port=80
      - traefik.http.routers.grafana-rtr.entrypoints=http,https
      - traefik.http.routers.grafana-rtr.rule=Host(`grafana.localhost`)
      - traefik.http.routers.grafana-rtr.tls=true
      - traefik.http.routers.grafana-rtr.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana-rtr.service=grafana-svc

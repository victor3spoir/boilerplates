apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-nextcloud-app
  namespace: nextcloud
  labels:
    app: nextcloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextcloud-app
  template:
    metadata:
      namespace: nextcloud
      labels:
        app: nextcloud-app
    spec:
      containers:
        - name: nextcloud-app
          image: nextcloud:28
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: service-nextcloud
  namespace: nextcloud
spec:
  selector:
    app: nextcloud-app
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80


name: drupal

networks:
  docker-net:
    external: true
  drupalnet: {}

volumes:
  drupal-db-vol:
    name: drupal-db-vol
    # driver: local
    # driver_opts:
    #   type: nfs
    #   device: :/path/to/volume
    #   o: 'addr=127.0.0.1,rw'
  drupal-web-vol:
    name: drupal-web-vol
    # driver: local
    # driver_opts:
    #   type: nfs
    #   device: :/path/to/volume
    #   o: 'addr=127.0.0.1,rw'
services:
  drupal-postgres:
    image: postgres:17-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: "264MiB"
          cpus: "0.25"
        limits:
          memory: "528MiB"
          cpus: "0.5"
    networks:
      - drupalnet
    environment:
      - POSTGRES_USER
      - POSTGRES_DB
      - POSTGRES_PASSWORD

  drupal-web:
    image: drupal:10-apache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: "264MiB"
          cpus: "0.25"
        limits:
          memory: "528MiB"
          cpus: "0.5"
    networks:
      - docker-net
      - drupalnet
    ports:
      - 127.0.0.1:8085:80
    volumes:
      - drupal-web-vol:/var/www/html
    labels:
      traefik.enable: "true"
      traefik.http.services.drupal-svc.loadbalancer.server.port: "80"
      traefik.http.routers.drupal-rtr.entrypoints: web,websecure
      traefik.http.routers.drupal-rtr.rule: Host(`drupal.localhost`)
      traefik.http.routers.drupal-rtr.tls: "true"
      traefik.http.routers.drupal-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.drupal-rtr.service: drupal-svc

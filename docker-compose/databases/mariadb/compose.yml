name: mariadb

services:
  mariadb:
    image: mariadb:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: "250MiB"
          cpus: "0.25"
        limits:
          memory: "500MiB"
          cpus: "0.5"
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: db
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    networks:
      db-net:
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    configs:
      - source: my_cnf
        target: /etc/mysql/my.cnf
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost' ]
      interval: 30s
      timeout: 10s
      retries: 5

configs:
  my_cnf:
    file: "./configs/my.conf"

volumes:
  mariadb_data:
    driver: local

networks:
  db-net:
    external: true

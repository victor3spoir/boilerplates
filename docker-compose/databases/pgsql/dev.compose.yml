name: pgsql-dev



services:
  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "200MiB"
          cpus: "0.2"
    networks:
      docker-net:
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgsql-vol:/var/lib/postgresql


networks:
  docker-net:
    external: true

volumes:
  pgsql-vol:
    name: pgsql-vol
    driver: local

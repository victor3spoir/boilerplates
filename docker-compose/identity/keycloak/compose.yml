name: keycloak

services:
  keycloack-db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: xxxxxxxxxxxxxx
    volumes:
      - keycloak-db-vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      keycloak-net:

  keycloak:
    depends_on:
      keycloack-db:
        condition: service_healthy
    image: keycloak/keycloak:26.5
    container_name: keycloak
    restart: unless-stopped
    command:
      - start
      # - --optimized
    secrets:
      - keycloack_admin
      - keycloack_password
    environment:
      KEYCLOAK_ADMIN_FILE: "/run/secrets/keycloack_admin"
      KEYCLOAK_ADMIN_PASSWORD_FILE: "/run/secrets/keycloack_password"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloack-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: xxxxxxxxxxxxxx
      KC_PROXY: edge
      KC_HOSTNAME: keycloak.localhost
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_CACHE: ispn


    labels:
      traefik.enable: "true"
      traefik.http.services.keycloak-svc.loadbalancer.server.port: "8080"
      traefik.http.routers.keycloak-rtr.rule: "Host(`keycloak.localhost`)"
      traefik.http.routers.keycloak-rtr.entrypoints: "websecure"
      traefik.http.routers.keycloak-rtr.tls: "true"
      traefik.http.routers.keycloak-rtr.tls.certresolver: "letsencrypt"

      traefik.http.routers.keycloak-rtr.service: "keycloak-svc"
      traefik.http.routers.keycloak-rtr.middlewares: "keycloak-headers"

      # Optional security headers
      traefik.http.middlewares.keycloak-headers.headers.sslredirect: "true"
      traefik.http.middlewares.keycloak-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.keycloak-headers.headers.stsIncludeSubdomains: "true"

    networks:
      docker-net:
      keycloak-net:


secrets:
  keycloack_admin:
    file: "./secrets/admin"
  keycloack_password:
    file: "./secrets/password"


volumes:
  keycloak-db-vol:
    name: keycloak-db-vol
    driver: local

networks:
  docker-net:
    external: true
  keycloak-net:
    internal: true

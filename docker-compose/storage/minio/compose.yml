networks:
  docker-net:
    external: true

volumes:
  minio-vol:
    name: minio-vol
    driver: local


services:
  minio:
    image: quay.io/minio/minio:latest
    deploy:
      resources:
        reservations:
          memory: "512MiB"
          cpus: "1.0"
        limits:
          memory: "1024MiB"
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      - docker-net
    ports:
      - 127.0.0.1:9000:9000 # api
      - 127.0.0.1:9001:9001 # webui
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password123!
      MINIO_SERVER_URL: https://minio.localhost

    volumes:
      - minio-vol:/data:rw
    labels:
      traefik.enable: "true"
      traefik.http.services.minio.loadbalancer.server.port: 9000
      traefik.http.routers.minio.entrypoints: web,websecure
      traefik.http.routers.minio.tls: true
      traefik.http.routers.minio.tls.certresolver: letsencrypt
      traefik.http.routers.minio.rule: Host(`minio.localhost`)

  minio-client:
    image: minio/mc
    networks:
      - docker-net
    entrypoint: |
      /bin/sh -c "/usr/bin/mc --help"
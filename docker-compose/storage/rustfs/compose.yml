# https://docs.rustfs.com/installation/
# (RUSTFS_ACCESS_KEY)rustfsadmin / (RUSTFS_SECRET_KEY)rustfsadmin

name: rustfs

services:
  rustfs:
    image: rustfs/rustfs:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: "350MiB"
          cpus: "0.25"
        limits:
          memory: "700MiB"
          cpus: "0.5"
    networks:
      docker-net:
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl --fail --silent http://127.0.0.1:9000/health/ready && curl --fail --silent http://127.0.0.1:9001/rustfs/console/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET}
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: https://${RUSTFS_CONSOLE_DOMAIN}
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"

      # RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs
      # RUSTFS_OBS_ENDPOINT: http://localhost:4318

    volumes:
      - rustfs-vol:/data
    labels:
      traefik.enable: "true"

      # S3 API
      traefik.http.services.rustfs-api-svc.loadbalancer.server.port: "9000"
      traefik.http.routers.rustfs-api-rtr.entrypoints: websecure
      traefik.http.routers.rustfs-api-rtr.rule: Host(`${RUSTFS_SERVER_DOMAINS}`)
      traefik.http.routers.rustfs-api-rtr.tls: "true"
      traefik.http.routers.rustfs-api-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.rustfs-api-rtr.service: rustfs-api-svc

      # Administration console
      traefik.http.services.rustfs-console-svc.loadbalancer.server.port: "9001"
      traefik.http.routers.rustfs-console-rtr.entrypoints: websecure
      traefik.http.routers.rustfs-console-rtr.rule: Host(`${RUSTFS_CONSOLE_DOMAIN}`)
      traefik.http.routers.rustfs-console-rtr.tls: "true"
      traefik.http.routers.rustfs-console-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.rustfs-console-rtr.service: rustfs-console-svc
      # traefik.http.routers.rustfs-console-rtr.middlewares: rustfs-console-allowlist@file


networks:
  docker-net:
    external: true

volumes:
  rustfs-vol:
    name: rustfs-vol

global:
  resolve_timeout: 5m

route:
  receiver: web-hook
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: web-hook
    webhook_configs:
      - url: http://host.docker.internal:5001/

  - name: gmail-notifications
    email_configs:
      - to: monitoring@gmail.com
        from: monitoring@gmail.com
        smarthost: mailpit:1025
        auth_username: monitoring@gmail.com
        auth_identity: monitoring@gmail.com
        auth_password: Password123!
        send_resolved: true
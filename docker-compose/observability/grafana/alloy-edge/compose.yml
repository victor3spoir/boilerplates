name: alloy-edge

services:
  alloy-edge:
    image: grafana/alloy:latest
    deploy:
      resources:
        reservations:
          memory: "256MiB"
          cpus: "0.5"
        limits:
          memory: "512MiB"
          cpus: "1.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: alloy-edge
    expose:
      - 4317 #gprc
      - 4318 #http
      - 12345 #ui
    command: |
      run 
      --server.http.listen-addr=0.0.0.0:12345
      --stability.level=public-preview
      --storage.path=/var/lib/alloy/data
      /etc/alloy
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:4317:4317'
    networks:
      docker-net:
      grafana-net:
    environment:
      HOSTNAME: alloy-edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs:/etc/alloy/:ro
      # - /var/log/auth:/var/log/auth:ro
    labels:
      traefik.enable: "true"
      traefik.http.services.alloy-edge-ui-svc.loadbalancer.server.port: 12345
      traefik.http.routers.alloy-edge-ui-rtr.entrypoints: web,websecure
      traefik.http.routers.alloy-edge-ui-rtr.rule: Host(`alloy-edge-ui.localhost`)
      traefik.http.routers.alloy-edge-ui-rtr.tls: true
      traefik.http.routers.alloy-edge-ui-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.alloy-edge-ui-rtr.service: alloy-edge-ui-svc

networks:
  docker-net:
    external: true
  grafana-net:
    external: true

volumes:
  alloy-vol:
    name: alloy-vol



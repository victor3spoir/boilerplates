name: grafana-dashboard

configs:
  grafana_config:
    file: ./configs/grafana.ini
  caddy_config:
    file: ./configs/dashboard.Caddyfile

services:
  grafana-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "200MiB"
    volumes:
      - grafana-redis-vol:/data
    networks:
      grafana-net:

  grafana-db:
    image: postgres:18-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.3
          memory: "500MiB"
    volumes:
      - grafana-db-vol:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: grafana
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      grafana-net:
  
  grafana-01:
    depends_on:
      - grafana-db
      - grafana-redis
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "500MiB"
          cpus: "0.5"
    volumes:
      - grafana-01-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      GF_SERVER_DOMAIN: grafana.localhost
      GF_SERVER_ROOT_URL: https://grafana.localhost
      GF_SERVER_ROUTER_LOGGING: true
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_CLUSTERING_ENABLED: true
      GF_CLUSTERING_NAME: grafana-cluster
      GF_CLUSTERING_ADVERTISE_ADDRESS: grafana-01:9094
      GF_CLUSTERING_GOSSIP_INTERVAL: 200ms
    networks:
      grafana-net:
      docker-net:

  grafana-02:
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "500MiB"
          cpus: "0.5"
    volumes:
      - grafana-02-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      GF_SERVER_DOMAIN: grafana.localhost
      GF_SERVER_ROOT_URL: https://grafana.localhost
      GF_SERVER_ROUTER_LOGGING: true
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_CLUSTERING_ENABLED: true
      GF_CLUSTERING_NAME: grafana-cluster
      GF_CLUSTERING_ADVERTISE_ADDRESS: grafana-02:9094
      GF_CLUSTERING_JOIN: grafana-01:9094
      GF_CLUSTERING_GOSSIP_INTERVAL: 200ms
    networks:
      grafana-net:
      docker-net:
    depends_on:
      - grafana-01

  grafana-03:
    image: grafana/grafana-enterprise:main
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "500MiB"
          cpus: "0.5"
    volumes:
      - grafana-03-vol:/var/lib/grafana
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
    environment:
      GF_SERVER_DOMAIN: grafana.localhost
      GF_SERVER_ROOT_URL: https://grafana.localhost
      GF_SERVER_ROUTER_LOGGING: true
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_CLUSTERING_ENABLED: true
      GF_CLUSTERING_NAME: grafana-cluster
      GF_CLUSTERING_ADVERTISE_ADDRESS: grafana-03:9094
      GF_CLUSTERING_JOIN: grafana-01:9094
      GF_CLUSTERING_GOSSIP_INTERVAL: 200ms
    networks:
      grafana-net:
      docker-net:
    depends_on:
      - grafana-01
      - grafana-redis

  grafana:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "200MiB"
    volumes:
      - grafana-caddy-vol:/data
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    networks:
      grafana-net:
      docker-net:
    depends_on:
      grafana-01:
        condition: service_started
      grafana-02:
        condition: service_started
      grafana-03:
        condition: service_started
      grafana-redis:
        condition: service_started
    labels:
      traefik.enable: true
      traefik.http.services.grafana-svc.loadbalancer.server.port: 80
      traefik.http.routers.grafana-rtr.entrypoints: web,websecure
      traefik.http.routers.grafana-rtr.rule: Host(`grafana.localhost`)
      traefik.http.routers.grafana-rtr.tls: true
      traefik.http.routers.grafana-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.grafana-rtr.service: grafana-svc

volumes:
  grafana-01-vol:
    name: grafana-01-vol
    driver: local
  grafana-02-vol:
    name: grafana-02-vol
    driver: local
  grafana-03-vol:
    name: grafana-03-vol
    driver: local
  grafana-db-vol:
    name: grafana-db-vol
    driver: local
  grafana-redis-vol:
    name: grafana-redis-vol
    driver: local
  grafana-caddy-vol:
    name: grafana-caddy-vol
 


networks:
  grafana-net:
    external: true
  docker-net:
    external: true

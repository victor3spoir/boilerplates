[server]
protocol = http
http_port = 3000
domain = grafana.localhost
root_url = https://grafana.localhost
serve_from_sub_path = true

[database]
type = postgres
host = grafana-db:5432
name = grafana
user = postgres
password = Password123!
ssl_mode = disable

[security]
admin_user = admin
admin_email = admin@local.host
admin_password = Password123!

[users]
allow_sign_up = false
default_theme = light

[auth]
disable_login_form = false
oauth_auto_login = false

[auth.anonymous]
enabled = false

[clustering]
enabled = true

[session]
provider = redis
provider_config = addr=grafana-redis:6379,pool_size=100,db=0

[remote_cache]
type = redis
connstr = addr=grafana-redis:6379,pool_size=100,db=1

[smtp]
enabled = true
host = mailpit:1025
user = v3r
password = Password123!
skip_verify = true
from_address = admin@local.host
from_name = no-reply
enable_tracing = true

[log]
level = warn
[log.console]
format = json

[feature_toggles]
provisioning = true
kubernetesDashboards = true ; use k8s from browser
[log]
level = warn

[log.console]
format = json

[server]
protocol = http
http_port = 3000
serve_from_sub_path = true

[database]
type = postgres
name = grafana
host = grafana-db:5432
ssl_mode = disable
migration_locking = true
locking_attempt_timeout_sec = 60


[users]
allow_sign_up = false
default_theme = light

[auth]
disable_login_form = false
oauth_auto_login = false

[auth.anonymous]
enabled = false

[clustering]
enabled = true

[remote_cache]
type = redis
connstr = network=tcp,addr=grafana-redis:6379,pool_size=100,db=1

[unified_alerting]
enabled = true
ha_redis_address = grafana-redis:6379
ha_redis_prefix = grafana-alerting


[smtp]
enabled = true
host = mailpit:1025
skip_verify = true
from_address = admin@local.host
from_name = no-reply
enable_tracing = false


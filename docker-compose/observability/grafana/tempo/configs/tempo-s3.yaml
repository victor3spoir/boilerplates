stream_over_http_enabled: true
multitenancy_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9095
  log_level: warn
  graceful_shutdown_timeout: 30s

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: s3
    blocklist_poll: 5m

    wal:
      path: ${TEMPO_DATA_PATH:-/var/tempo}/wal

    s3:
      endpoint: ${TEMPO_S3_ENDPOINT}
      region: ${TEMPO_S3_REGION}
      bucket: ${TEMPO_S3_BUCKET}
      access_key: ${TEMPO_S3_ACCESS_KEY}
      secret_key: ${TEMPO_S3_SECRET_KEY}
      forcepathstyle: true
      insecure: false
      tls_insecure_skip_verify: false

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 720h

backend_worker:
  compaction:
    block_retention: 720h
    compacted_block_retention: 1h
    compaction_window: 1h
    retention_concurrency: 2

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ${TEMPO_CLUSTER:-docker}

  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: ${TEMPO_METRICS_REMOTE_WRITE_URL}
        send_exemplars: true

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824
    query_backend_after: 15m

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
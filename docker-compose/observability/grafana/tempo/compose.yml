name: tempo

services:
  tempo:
    image: grafana/tempo:main-e79e340-1974-1
    restart: unless-stopped
    expose:
      - 3200
      - 4317 # gprc
      - 4318 # http
    deploy:
      resources:
        limits:
          memory: 500Mib
          cpus: "0.5"
    command:
      - -config.file=/etc/tempo.yaml
    networks:
      docker-net:
      grafana-net:
    configs:
      - source: tempo_yaml
        target: /etc/tempo.yaml
    labels:
      traefik.enable: true
      traefik.http.services.tempo-svc.loadbalancer.server.port: 3200
      traefik.http.routers.tempo-rtr.rule: Host(`tempo.localhost`)
      traefik.http.routers.tempo-rtr.tls: true
      traefik.http.routers.tempo-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.tempo-rtr.service: tempo-svc
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O-",
          "http://localhost:3200/ready"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  tempo_yaml:
    file: "./configs/tempo.yaml"

networks:
  docker-net:
    external: true
  grafana-net:
    external: true

volumes:
  tempo-vol:
    name: tempo-vol
    driver: local

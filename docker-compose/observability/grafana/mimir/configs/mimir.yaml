server:
  log_level: warn
  http_listen_port: 8080

memberlist:
  join_members:
    - mimir-01
    - mimir-02
    - mimir-03
    - mimir-04

multitenancy_enabled: false
no_auth_tenant: true
target: all,overrides-exporter

common:
  storage:
    backend: filesystem
    # backend: s3
    # s3:
    #   endpoint: grafana-minio:9000
    #   access_key_id: admin
    #   secret_access_key: password
    #   insecure: true
    #   bucket_name: mimir

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb

ingester:
  ring:
    replication_factor: 3

distributor:
  ring:
    kvstore:
      store: memberlist

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

ruler:
  # rule_path: s3://mimir/ruler
  rule_path: /data/ruler
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 15s
  ring:
    heartbeat_period: 2s
    heartbeat_timeout: 10s
  # storage:
  #   backend: s3
  #   s3:
  #     bucket_name: mimir-ruler

store_gateway:
  sharding_ring:
    replication_factor: 3

limits:
  max_label_names_per_series: 40

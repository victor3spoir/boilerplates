name: emby

services:
  emby:
    image: emby/embyserver:latest
    restart: unless-stopped
    container_name: embyserver
    # runtime: nvidia # Expose NVIDIA GPUs
    networks:
      docker-net:
    environment:
      UID: 1000 
      GID: 100 
      GIDLIST: 100 
    volumes:
      - ./config:/config # Configuration directory
      - emby_movies_vol:/mnt/share1 # Media directory
      # - /path/to/movies:/mnt/share2 # Media directory
    # ports:
    #   - 8096:8096 # HTTP port
    #   - 8920:8920 # HTTPS port
    # devices:
      # - /dev/dri:/dev/dri # VAAPI/NVDEC/NVENC render nodes
      # - /dev/vchiq:/dev/vchiq # MMAL/OMX on Raspberry Pi
    labels:
      traefik.enable: true
      traefik.http.services.emby-svc.loadbalancer.server.port: 8096
      traefik.http.routers.emby-rtr.entrypoints: web,websecure
      traefik.http.routers.emby-rtr.rule: Host(`emby.localhost`)
      traefik.http.routers.emby-rtr.tls: true
      traefik.http.routers.emby-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.emby-rtr.service: emby-svc

networks:
  docker-net:
    external: true

volumes:
  emby_movies_vol:
   name: emby_movies_vol

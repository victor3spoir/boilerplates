name: portainer

services:
  portainer:
    image: portainer/portainer-ce:sts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400Mib
          cpus: 0.4
    networks:
      - docker-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-vol:/data:rw
    labels:
      autoheal: true
      traefik.enable: true
      traefik.http.services.portainer-svc.loadbalancer.server.port: 9000
      traefik.http.routers.portainer-rtr.entrypoints: web,websecure
      traefik.http.routers.portainer-rtr.rule: Host(`portainer.localhost`)
      traefik.http.routers.portainer-rtr.tls: true
      traefik.http.routers.portainer-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.portainer-rtr.service: portainer-svc
      # - traefik.http.routers.portainer-rtr.tls.middlewares=




volumes:
  portainer-vol:
    name: portainer-vol
    driver: local
    # driver_opts:
    #   type: nfs4
    #   o: "addr=127.0.0.1,rw"
    #   device: ":/mnt/storage01/docker/portainer"

networks:
  docker-net:
    external: true

# Intial setup: https://authentik.localhost/if/flow/initial-setup/
name: authentik

x-authentik: &authentik
  image: authentik/server:2026.5.3
  depends_on:
    authentik-db:
      condition: service_healthy
    authentik-redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    authentik-net:
  environment:
    AUTHENTIK_URL: https://authentik.localhost
    AUTHENTIK_SECRET_KEY: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" 
    AUTHENTIK_REDIS__HOST: authentik-redis
    AUTHENTIK_POSTGRESQL__HOST: authentik-db
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: xxxxxxxxxxxxxx
    AUTHENTIK_EMAIL__HOST: mailpit
    AUTHENTIK_EMAIL__PORT: 1025
    AUTHENTIK_EMAIL__USERNAME: username
    AUTHENTIK_EMAIL__PASSWORD: password
    AUTHENTIK_EMAIL__USE_SSL: false
    AUTHENTIK_EMAIL__TIMEOUT: 10
    AUTHENTIK_EMAIL__USE_TLS: true
    AUTHENTIK_EMAIL__FROM: authentik@local.host

services:
  authentik-db:
    image: postgres:18-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

    networks:
      authentik-net:
    deploy:
      resources:
        reservations:
          memory: "200MiB"
          cpus: "0.2"
        limits:
          memory: "400MiB"
          cpus: "0.4"
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}' ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik-db-vol:/var/lib/postgresql
      # - ./backups:/backups
    environment:
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: xxxxxxxxxxxxxx

  authentik-redis:
    image: redis:8-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    deploy:
      resources:
        reservations:
          memory: "100MiB"
          cpus: "0.1"
        limits:
          memory: "200MiB"
          cpus: "0.2"
    networks:
      authentik-net:
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli ping | grep PONG' ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik-redis-vol:/data

  authentik-worker:
    <<: *authentik
    command: worker
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: "500MiB"
          cpus: "0.25"
        limits:
          memory: "1000MiB"
          cpus: "0.5"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./media:/media
      # - ./certs:/certs
      # - ./custom-templates:/templates

    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-server:
    depends_on:
      authentik-worker:
        condition: service_started
    <<: *authentik
    command: server
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: "300MiB"
          cpus: "0.3"
        limits:
          memory: "600MiB"
          cpus: "0.6"
    networks:
      authentik-net:
      docker-net:

        # volumes:
        #   - ./media:/media
        #   - ./custom-templates:/templates
    labels:
      traefik.enable: "true"
      traefik.http.services.authentik-svc.loadbalancer.server.port: 9000
      traefik.http.routers.authentik-rtr.entrypoints: web,websecure
      traefik.http.routers.authentik-rtr.rule: Host(`authentik.localhost`)
      traefik.http.routers.authentik-rtr.tls: true
      traefik.http.routers.authentik-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-rtr.service: authentik-svc
      # traefik.http.routers.authentik-rtr.middlewares: 




volumes:
  authentik-db-vol:
    driver: local
  authentik-redis-vol:
    driver: local

networks:
  docker-net:
    external: true
  authentik-net:
    driver: bridge

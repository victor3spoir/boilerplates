# https://goteleport.com/docs/reference/deployment/backends/#postgresql
# "tbot","tctl","tsh"

name: teleport

services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.10.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    container_name: teleport
    hostname: teleport
    configs:
      - source: teleport_yaml
        target: /etc/teleport/teleport.yaml
    expose:
      - 3080
      - 3023
      - 3024
      - 3025
    volumes:
      - teleport-vol:/var/lib/teleport
    deploy:
      resources:
        reservations:
          memory: "300MiB"
          cpus: "0.3"
        limits:
          memory: "600MiB"
          cpus: "0.6"
    networks:
      docker-net:
    labels:
      traefik.enable: "true"
      traefik.http.services.teleport-svc.loadbalancer.server.port: 3080
      traefik.http.services.teleport-svc.loadbalancer.server.scheme: https
      traefik.http.services.teleport-svc.loadbalancer.serverstransport: teleport@file
      traefik.tcp.services.teleport-ssh.loadbalancer.server.port: 3023
      traefik.tcp.services.teleport-tunnel.loadbalancer.server.port: 3024

      traefik.http.routers.teleport-rtr.rule: Host(`teleport.localhost`)
      traefik.http.routers.teleport-rtr.entrypoints: websecure
      traefik.http.routers.teleport-rtr.tls: true
      traefik.http.routers.teleport-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.teleport-rtr.tls.domains[0].main: teleport.localhost
      traefik.http.routers.teleport-rtr.tls.domains[0].sans: "*.teleport.localhost"
      traefik.http.routers.teleport-rtr.service: teleport-svc

volumes:
  teleport-vol:
    name: teleport-vol
    driver: local

configs:
  teleport_yaml:
    file: "./configs/teleport.yaml"

networks:
  docker-net:
    external: true

#  DOCKER_HOST: tcp://docker-proxy:2375
name: docker-proxy

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:master
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          memory: "200MiB"
          cpus: "0.2"
    expose:
      - 2375
    networks:
      docker-net:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  docker-net:
    external: true

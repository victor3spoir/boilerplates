global:
  checkNewVersion: true
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: false

api:
  insecure: true
  dashboard: true
  debug: true

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          scheme: https
          to: websecure
          permanent: true
  websecure:
    address: ":443"
    allowACMEByPass: true
    # proxyProtocol:
    #   trustedIPs:
    #     - "0.0.0.0/0"
    http:
      encodedCharacters:
        allowEncodedQuestionMark: false
        allowEncodedSlash: false
      # middlewares:
      #   - crowdsec@file
    transport:
      respondingTimeouts:
        readTimeout: "0s"
        writeTimeout: "0s"
        idleTimeout: "0s"
    #   tls:
    #     certResolver: letsencrypt
    # transport:
    #   respondingTimeouts:
    #     readTimeout: 30m
  pgsql:
    address: ":5432"

providers:
  docker:
    endpoint: "tcp://traefik-socket-proxy:2375"
    exposedByDefault: false
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
  # http:
  #   endpoint: http://pangolin:3001/api/v1/traefik-config
  #   pollInterval: 5s



certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@gmail.com
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      # caServer: "https://acme-v02.api.letsencrypt.org/directory"
      storage: "/var/traefik/certs/letsencrypt.json"
      httpChallenge:
        entryPoint: web


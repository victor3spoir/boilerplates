name: bind9

services:
  bind9:
    image: ubuntu/bind9:edge
    deploy:
      resources:
        reservations:
          memory: "128MiB"
          cpus: "0.25"
        limits:
          memory: "256MiB"
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: bind9
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - BIND9_USER=root
      - TZ=UTC
    volumes:
      - ./config:/etc/bind
      - ./zones:/etc/bind/zones
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind
    labels:
      traefik.enable: "true"
name: excalidraw

networks:
  docker-net:
    external: true

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          memory: "100MiB"
          cpus: "0.1"
        limits:
          memory: "200MiB"
          cpus: "0.2"
    # ports:
    #   - 80:80
    networks:
      - docker-net
    labels:
      traefik.enable: "true"
      traefik.http.services.excalidraw-svc.loadbalancer.server.port: "80"
      traefik.http.routers.excalidraw-rtr.rule: Host(`excalidraw.localhost`)
      traefik.http.routers.excalidraw-rtr.tls: "true"
      traefik.http.routers.excalidraw-rtr.tls.certresolver: letsencrypt
      traefik.http.routers.excalidraw-rtr.service: excalidraw-svc
      # traefik.http.routers.excalidraw-rtr.middlewares:

name: kafka-dev

services:
  kafka-controller:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    hostname: kafka-controller
    networks:
      - kafka-net
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "500MiB"
    environment:
      - KAFKA_NODE_ID=201
      - KAFKA_PROCESS_ROLES=controller
      - KAFKA_LISTENERS=CONTROLLER://:9093
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PRIVATE_NET
      - KAFKA_CONTROLLER_QUORUM_VOTERS=201@kafka-controller:9093
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0

  kafka-broker:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    hostname: kafka-broker
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "500MiB"
    networks:
      - kafka-net
      - docker-net
    ports:
      - 9092:9092
    environment:
      - KAFKA_LISTENERS=PRIVATE_NET://:9091,PUBLIC_NET://:9092
      - KAFKA_ADVERTISED_LISTENERS=PRIVATE_NET://kafka-broker:9091,PUBLIC_NET://kafka-broker:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PRIVATE_NET:PLAINTEXT,CONTROLLER:PLAINTEXT,PUBLIC_NET:PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_NODE_ID=101
      - KAFKA_PROCESS_ROLES=broker
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=201@kafka-controller:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PRIVATE_NET

      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3

networks:
  docker-net:
    external: true
  kafka-net:
    external: false

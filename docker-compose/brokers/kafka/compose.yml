      traefik.tcp.routers.kafka-03-rtr.rule: HostSNI(`kafka-03.localhost`)
      traefik.tcp.routers.kafka-03-rtr.service: kafka-svc-03

networks:
  docker-net:
    external: true
  kafka-net:
    external: true

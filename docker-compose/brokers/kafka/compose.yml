name: kafka

services:
  kafka-controller-01:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: kafka-controller-01
    networks:
      kafka-net:
      docker-net:
    deploy:
      resources:
        reservations:
          memory: "500MiB"
          cpus: "0.25"
        limits:
          memory: "1000MiB"
          cpus: "0.5"
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PRIVATE_NET:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PRIVATE_NET
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-controller-01:9093,102@kafka-controller-02:9093,103@kafka-controller-03:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-controller-02:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: kafka-controller-02
    networks:
      kafka-net:
      docker-net:
    deploy:
      resources:
        reservations:
          memory: "500MiB"
          cpus: "0.25"
        limits:
          memory: "1000MiB"
          cpus: "0.5"
    environment:
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PRIVATE_NET
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PRIVATE_NET:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-controller-01:9093,102@kafka-controller-02:9093,103@kafka-controller-03:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-controller-03:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: kafka-controller-03
    networks:
      kafka-net:
      docker-net:
    deploy:
      resources:
        reservations:
          memory: "500MiB"
          cpus: "0.25"
        limits:
          memory: "1000MiB"
          cpus: "0.5"
    environment:
      KAFKA_NODE_ID: 103
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PRIVATE_NET
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PRIVATE_NET:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-controller-01:9093,102@kafka-controller-02:9093,103@kafka-controller-03:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-broker-01:
    depends_on:
      - kafka-controller-01
      - kafka-controller-02
      - kafka-controller-03
    image: apache/kafka:4.3.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: kafka-broker-01
    networks:
      kafka-net:
      docker-net:
    deploy:
      resources:
        reservations:
          memory: "500MiB"
          cpus: "0.25"
        limits:
          memory: "1000MiB"
          cpus: "0.5"
    environment:
      KAFKA_NODE_ID: 201
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PRIVATE_NET://:9091,PUBLIC_NET://:9092
      KAFKA_ADVERTISED_LISTENERS: PRIVATE_NET://kafka-broker-01:9091,PUBLIC_NET://kafka-01.localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PRIVATE_NET
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PRIVATE_NET:PLAINTEXT,PUBLIC_NET:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-controller-01:9093,102@kafka-controller-02:9093,103@kafka-controller-03:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    labels:
      traefik.enable: "true"
      traefik.tcp.services.kafka-svc-01.loadbalancer.server.port: 9092
      traefik.tcp.routers.kafka-01-rtr.entrypoints: kafka
      traefik.tcp.routers.kafka-01-rtr.rule: HostSNI(`kafka-01.localhost`)
      traefik.tcp.routers.kafka-01-rtr.service: kafka-svc-01


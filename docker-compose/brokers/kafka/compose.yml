    environment:
      KAFKA_NODE_ID: 203
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PRIVATE_NET://:9091,PUBLIC_NET://:9092
      KAFKA_ADVERTISED_LISTENERS: PRIVATE_NET://kafka-broker-03:9091,PUBLIC_NET://kafka-03.localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PRIVATE_NET
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PRIVATE_NET:PLAINTEXT,PUBLIC_NET:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-controller-01:9093,102@kafka-controller-02:9093,103@kafka-controller-03:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    labels:
